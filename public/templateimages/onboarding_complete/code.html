<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding Complete - EatFit</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#6a8d4e",
              "background-light": "#f7f7f6",
              "background-dark": "#191c16",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#141712] dark:text-white antialiased transition-colors duration-200">
<!-- Root Container -->
<div class="relative flex flex-col h-screen w-full max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header / Progress Indicator -->
<!-- Adapted from PageIndicators component: Shows completion state -->
<div class="flex w-full flex-row items-center justify-center gap-2 pt-8 pb-4">
<!-- Completed steps (lighter primary) -->
<div class="h-2 w-2 rounded-full bg-primary/40"></div>
<div class="h-2 w-2 rounded-full bg-primary/40"></div>
<div class="h-2 w-2 rounded-full bg-primary/40"></div>
<!-- Current/Final step (solid primary, slightly elongated for emphasis) -->
<div class="h-2 w-6 rounded-full bg-primary transition-all duration-500"></div>
</div>
<!-- Main Content Area -->
<!-- Centered vertically for a focused, celebratory feel -->
<div class="flex flex-1 flex-col items-center justify-center px-6">
<!-- Success Illustration Area -->
<!-- Adapted from EmptyState component -->
<div class="relative mb-8 flex flex-col items-center justify-center">
<!-- Abstract aura/glow behind image -->
<div class="absolute inset-0 bg-primary/20 dark:bg-primary/10 rounded-full blur-3xl transform scale-110"></div>
<!-- Main Image -->
<div class="relative bg-center bg-no-repeat bg-cover rounded-3xl w-64 h-64 shadow-xl shadow-primary/10 dark:shadow-none border-4 border-white dark:border-[#2C3025]" data-alt="A healthy, vibrant salad bowl filled with fresh greens, avocado, and nutritious vegetables" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCyzL01JagHTiZP6w-MGEIz6EyCuwj-xF2X8EW2EuosKdds8DSnVs_XfGv0K2m-bY7eG_mG82dpf9_9TUu7ycSEPEl7cX1l361QGe3aaqZPkQntifwor1M7eyx6VehPPeAjBz6oAF8sB3iIKpxUFSx9SSTVstH9_ZumGExeqo5EjZm6UZTZ2gExTN62usw4PzU0V8ATacUHm_h3nxHi9bWvW9NO8-qioicUDEm-ukUky4oddYwkuyUz9bZ7hcFaSuAkQhXf_63jzA");'>
</div>
<!-- Floating Success Badge Icon -->
<!-- Positioned to overlap the image slightly -->
<div class="absolute -bottom-5 bg-white dark:bg-[#2C3025] rounded-full p-2 shadow-lg border-4 border-background-light dark:border-background-dark flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-primary font-bold">check_circle</span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center gap-3 mt-4 max-w-xs mx-auto">
<!-- HeadlineText adapted -->
<h1 class="text-[#141712] dark:text-white tracking-tight text-3xl font-extrabold leading-tight text-center">
                    You're all set!
                </h1>
<!-- BodyText adapted -->
<p class="text-[#141712]/70 dark:text-white/70 text-base font-normal leading-relaxed text-center">
                    Your personalized meal plan is ready. We've curated recipes that match your keto goals and preferences.
                </p>
</div>
</div>
<!-- Footer / CTA Section -->
<div class="flex flex-col gap-4 px-6 pb-10 pt-4 w-full bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark">
<!-- SingleButton adapted: Primary CTA -->
<button class="group relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-2xl h-14 px-5 bg-primary hover:bg-[#5b7a42] active:scale-[0.98] transition-all duration-200 shadow-lg shadow-primary/20 text-[#fafbf9] text-lg font-bold leading-normal tracking-[0.015em]">
<span class="truncate z-10">Go to Dashboard</span>
<!-- Subtle sheen effect on hover -->
<div class="absolute inset-0 -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] bg-gradient-to-r from-transparent via-white/20 to-transparent z-0"></div>
</button>
<!-- Secondary Action (Link) -->
<button class="flex w-full cursor-pointer items-center justify-center h-8 text-primary/80 dark:text-primary/70 text-sm font-medium hover:text-primary transition-colors">
                Retake Assessment
            </button>
</div>
</div>
</body></html>
