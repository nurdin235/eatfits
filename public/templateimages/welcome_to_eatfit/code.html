<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Welcome to EatFit</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6a8d4e",
                        "background-light": "#f7f7f6",
                        "background-dark": "#191c16",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .text-balance {
                text-wrap: balance;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#141712] dark:text-[#f7f7f6] antialiased">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden max-w-md mx-auto shadow-sm dark:shadow-none bg-background-light dark:bg-background-dark">
<!-- Header / Logo Area -->
<header class="flex items-center justify-center pt-8 pb-4 px-4 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">eco</span>
<span class="text-xl font-bold tracking-tight text-primary dark:text-primary">EatFit</span>
</div>
</header>
<!-- Main Content Wrapper -->
<main class="flex-1 flex flex-col w-full">
<!-- Hero Illustration -->
<div class="@container px-4 py-4 flex-1 flex flex-col justify-center">
<div class="w-full aspect-[4/5] max-h-[45vh] relative rounded-2xl overflow-hidden shadow-sm">
<!-- Background Blob/Color -->
<div class="absolute inset-0 bg-[#e8efe3] dark:bg-[#2c3326] z-0"></div>
<!-- Main Image -->
<div class="absolute inset-0 z-10 w-full h-full bg-center bg-contain bg-no-repeat transform scale-90 translate-y-2" data-alt="Illustration of a healthy bowl of salad with fresh avocado and greens" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCo1HDCZzGKWg8A2N6NT1j8x-uQqvrz2xGxamyr9isIQBtfab41T7KMfKn5Ey6yZ3NKggtRdEtvqSkIheDDWpHfiZUsY4ilREvVDCSGfR4wyQLNXDL-f-msTpre7ekdS0R0qohHuWRW2vfc73pK2DSNJ5TVORtqajp1dwNakXfNWste4zHzDWR9eNAa8JHsfgx3h14brjJp7MN1ljpFjdlh2TShPR9bJv2BsZm8gQJGJ_TRQFZ-tS0mVFddbdBmPFu2VYB3Qywf9g");'>
</div>
<!-- Overlay Gradient for better integration -->
<div class="absolute inset-0 bg-gradient-to-t from-background-light/20 via-transparent to-transparent dark:from-background-dark/20 z-20"></div>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col gap-2 pb-2">
<!-- Headline -->
<h1 class="text-[#141712] dark:text-white tracking-tight text-[32px] font-bold leading-[1.15] px-6 text-center text-balance">
                    Eat better, <br/>live simpler.
                </h1>
<!-- Body Text -->
<p class="text-[#4b5548] dark:text-[#a1aeb5] text-base font-medium leading-relaxed pt-2 px-6 text-center text-balance">
                    Join EatFit to discover meal plans tailored to your taste, budget, and health goals.
                </p>
</div>
<!-- Action Area -->
<div class="mt-auto px-4 pb-8 pt-6 w-full flex flex-col gap-4">
<!-- Primary Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-[#5a7a42] active:scale-[0.98] transition-all duration-200 text-[#fafbf9] text-base font-bold leading-normal tracking-[0.015em] shadow-md shadow-primary/20">
<span class="truncate">Start Setup</span>
<span class="material-symbols-outlined ml-2 text-[20px]">arrow_forward</span>
</button>
<!-- Secondary Link -->
<div class="flex justify-center items-center">
<p class="text-sm font-medium text-[#4b5548] dark:text-[#a1aeb5]">
                        Already have an account? 
                        <a class="text-primary hover:text-[#5a7a42] dark:hover:text-[#8ab36b] font-bold ml-1 transition-colors" href="#">Log in</a>
</p>
</div>
</div>
</main>
<!-- Bottom Spacing for phones with home indicator -->
<div class="h-2 bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
