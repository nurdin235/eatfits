<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EatFit - Pantry Setup</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#6a8d4e",
              "primary-dark": "#56723f",
              "background-light": "#f7f7f6",
              "background-dark": "#191c16",
              "surface-light": "#ffffff",
              "surface-dark": "#23271f",
              "text-main": "#141712",
              "text-muted": "#718165",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem", 
              "md": "0.375rem",
              "lg": "0.5rem", 
              "xl": "0.75rem", 
              "2xl": "1rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-100 dark:bg-gray-900 font-display flex items-center justify-center min-h-screen p-0 sm:p-4">
<!-- Mobile Container -->
<main class="relative w-full max-w-md h-screen sm:h-[850px] bg-background-light dark:bg-background-dark sm:rounded-2xl sm:shadow-2xl overflow-hidden flex flex-col">
<!-- Header / Progress -->
<header class="flex-none px-6 pt-8 pb-2 bg-background-light dark:bg-background-dark z-10">
<!-- Progress Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-2 mb-6">
<div class="h-1.5 w-1.5 rounded-full bg-primary/30 dark:bg-primary/20"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary/30 dark:bg-primary/20"></div>
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
<div class="h-1.5 w-1.5 rounded-full bg-primary/30 dark:bg-primary/20"></div>
</div>
<!-- Headline -->
<h1 class="text-text-main dark:text-white tracking-tight text-3xl font-bold leading-tight mb-2">
                Stock your pantry
            </h1>
<p class="text-text-muted dark:text-gray-400 text-base font-normal leading-relaxed">
                Add items you already have. This helps us tailor your first meal plan to reduce waste.
            </p>
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto no-scrollbar px-6 pb-24">
<!-- Input Form -->
<div class="mt-6 mb-8">
<div class="flex gap-3 items-end">
<label class="flex flex-col flex-[2]">
<span class="text-text-main dark:text-gray-200 text-sm font-medium mb-1.5">Item Name</span>
<div class="relative">
<input class="w-full rounded-xl border border-[#dbe0d7] dark:border-gray-700 bg-surface-light dark:bg-surface-dark text-text-main dark:text-white h-12 px-4 focus:ring-2 focus:ring-primary focus:border-primary placeholder:text-gray-400 transition-shadow" placeholder="e.g., Olive Oil" type="text"/>
</div>
</label>
<label class="flex flex-col flex-1">
<span class="text-text-main dark:text-gray-200 text-sm font-medium mb-1.5">Qty</span>
<input class="w-full rounded-xl border border-[#dbe0d7] dark:border-gray-700 bg-surface-light dark:bg-surface-dark text-text-main dark:text-white h-12 px-4 focus:ring-2 focus:ring-primary focus:border-primary text-center placeholder:text-gray-400 transition-shadow" placeholder="1" type="text"/>
</label>
<button class="h-12 w-12 flex items-center justify-center rounded-xl bg-primary text-white hover:bg-primary-dark transition-colors shadow-sm flex-none">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<!-- Suggestions Chips (Optional quick add) -->
<div class="flex gap-2 mt-3 overflow-x-auto no-scrollbar pb-1">
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-white dark:bg-surface-dark border border-[#dbe0d7] dark:border-gray-700 text-xs font-medium text-text-muted dark:text-gray-300 hover:border-primary hover:text-primary transition-colors whitespace-nowrap">
<span class="material-symbols-outlined text-[16px]">add</span> Salt
                    </button>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-white dark:bg-surface-dark border border-[#dbe0d7] dark:border-gray-700 text-xs font-medium text-text-muted dark:text-gray-300 hover:border-primary hover:text-primary transition-colors whitespace-nowrap">
<span class="material-symbols-outlined text-[16px]">add</span> Pepper
                    </button>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-white dark:bg-surface-dark border border-[#dbe0d7] dark:border-gray-700 text-xs font-medium text-text-muted dark:text-gray-300 hover:border-primary hover:text-primary transition-colors whitespace-nowrap">
<span class="material-symbols-outlined text-[16px]">add</span> Rice
                    </button>
</div>
</div>
<!-- Pantry List -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between mb-1">
<h3 class="text-text-main dark:text-white font-semibold text-lg">In your pantry</h3>
<span class="text-xs font-medium bg-primary/10 text-primary px-2 py-1 rounded-md">3 items</span>
</div>
<!-- List Item 1 -->
<div class="group flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 pr-4 rounded-xl border border-transparent shadow-sm hover:border-primary/20 transition-all">
<div class="flex items-center justify-center rounded-lg bg-[#edefeb] dark:bg-gray-800 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">check_circle</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-text-main dark:text-white text-base font-medium truncate">Brown Rice</p>
<p class="text-text-muted dark:text-gray-400 text-xs">2 lbs bag</p>
</div>
<button class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- List Item 2 -->
<div class="group flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 pr-4 rounded-xl border border-transparent shadow-sm hover:border-primary/20 transition-all">
<div class="flex items-center justify-center rounded-lg bg-[#edefeb] dark:bg-gray-800 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">check_circle</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-text-main dark:text-white text-base font-medium truncate">Extra Virgin Olive Oil</p>
<p class="text-text-muted dark:text-gray-400 text-xs">1 bottle</p>
</div>
<button class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- List Item 3 -->
<div class="group flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 pr-4 rounded-xl border border-transparent shadow-sm hover:border-primary/20 transition-all">
<div class="flex items-center justify-center rounded-lg bg-[#edefeb] dark:bg-gray-800 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">check_circle</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-text-main dark:text-white text-base font-medium truncate">Canned Chickpeas</p>
<p class="text-text-muted dark:text-gray-400 text-xs">3 cans</p>
</div>
<button class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Empty State Illustration Placeholder (Hidden when items exist, but good for structure) -->
<!-- 
                <div class="flex flex-col items-center justify-center py-8 text-center opacity-50">
                     <span class="material-symbols-outlined text-4xl mb-2 text-primary/40">kitchen</span>
                     <p class="text-sm text-text-muted">Your pantry is empty</p>
                </div> 
                -->
</div>
</div>
<!-- Sticky Footer -->
<div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pt-12">
<div class="flex flex-col gap-3">
<button class="w-full h-14 bg-primary hover:bg-primary-dark text-white rounded-xl font-semibold text-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                    Next Step
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<button class="w-full py-3 text-text-muted dark:text-gray-400 font-medium text-sm hover:text-text-main dark:hover:text-white transition-colors">
                    Skip for now
                </button>
</div>
</div>
</main>
<!-- Visual Debug (Optional, helps identify theme colors in output) -->

        <div class="flex items-center gap-2"><div class="w-4 h-4 bg-primary"></div> Primary</div>
        <div class="flex items-center gap-2 mt-1"><div class="w-4 h-4 bg-background-light border"></div> Bg Light</div>
        <div class="flex items-center gap-2 mt-1"><div class="w-4 h-4 bg-background-dark"></div> Bg Dark</div>
    </div> -->
</body></html>
